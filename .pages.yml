  - name: cameras
    label: "Dash cam catalogue"
    type: group
    items:
      - name: dashcam_blackvue
        label: "BlackVue"
        type: file
        path: content/catalogue-blackvue.json
        format: json
        fields:
          - name: products
            label: "Camera models"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{model} — £{price}"
            fields:
              - name: model
                label: Model
                type: string
                required: true
              - name: setup
                label: Camera configuration
                type: select
                required: true
                options:
                  values:
                    - name: front-rear
                      label: "Front + rear"
                    - name: front-only
                      label: "Front only"
              - name: type
                label: Camera type (e.g. 2CH)
                type: string
              - name: price
                label: Camera price excluding fitting (£)
                type: number
                required: true
              - name: image
                label: Product image
                type: image
                options:
                  media: dashcam_images
              - name: enquiry_model
                label: Model name included in enquiries
                type: string
                description: Use the full model and configuration name, e.g. Thinkware U3000 2CH.
              - name: enabled
                label: Show on website
                type: boolean
      - name: dashcam_thinkware
        label: "Thinkware"
        type: file
        path: content/catalogue-thinkware.json
        format: json
