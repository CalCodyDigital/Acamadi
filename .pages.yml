media:
  - name: blog_images
    label: Blog images
    input: images/blog
    output: /images/blog
    rename: safe
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

  - name: site_media
    label: Website images
    input: images/cms
    output: /images/cms
    rename: safe
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

  - name: dashcam_images
    label: Dash cam images
    input: images/dashcams
    output: /images/dashcams
    rename: safe
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

