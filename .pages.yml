  - name: stories
    label: "Blog & reviews"
    type: group
    items:
      - name: blog_posts
        label: "Blog posts"
        type: collection
        path: _posts
        format: yaml-frontmatter
        filename:
          template: "{date}-{title}.md"
          field: create
        view:
          primary: title
          sort: date
          order: desc
        fields:
          - name: layout
            type: string
            default: blog-post
            hidden: true
          - name: title
            label: Article title
            type: string
            required: true
          - name: date
            label: Publish date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: category
            label: Category
            type: select
            required: true
            options:
              values:
                - Detailing
                - Valeting
                - Ceramic Coatings
                - Dash Cams
                - Reverse Cameras
                - Vehicle Technology
                - Car Care
          - name: read_time
            label: Read time
            type: string
            default: 5 min read
          - name: excerpt
            label: Card summary
            type: text
            required: true
            description: Short summary used on the Blogs page.
          - name: image
            label: Featured image
            type: image
            options:
              media: blog_images
              path: images/blog
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: image_alt
            label: Image alt text
            type: string
          - name: seo_title
            label: SEO title
            type: string
            description: Optional. Leave blank to use the article title.
          - name: seo_description
            label: Meta description
            type: text
            description: Aim for roughly 140–160 characters.
          - name: cta_title
            label: CTA heading
            type: string
            default: Need help with your vehicle?
          - name: cta_text
            label: CTA text
            type: text
            default: Tell ACAMADI what you need and get a tailored recommendation.
          - name: cta_link
            label: CTA link
            type: string
            default: /index.html#services
          - name: cta_label
            label: CTA button label
            type: string
            default: Explore services
          - name: body
            label: Article
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: false
      - name: verified_reviews
        label: "Customer reviews"
        type: file
        path: content/reviews.json
        format: json
        list: true
        fields:
          - name: name
            label: Reviewer name
            type: string
            required: true
          - name: stars
            label: Star rating
            type: number
            required: true
          - name: body
            label: Verified review text
            type: text
            description: Only enter reviews genuinely submitted by customers. Preserve their original wording.

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "Blog: add {name}"
      update: "Blog: update {name}"
      delete: "Blog: remove {name}"
      rename: "Blog: rename {oldFilename} to {newFilename}"
